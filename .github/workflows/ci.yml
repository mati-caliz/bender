name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push encima de otro cancela la corrida vieja: solo importa el ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 porque el script `clean` usa `fs` como global de `node -e`, que no esta
      # garantizado en versiones anteriores.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # El build es parte del check: la extension tiene que poder empaquetarse.
      - run: npm run build

  # Aparte del job rapido: baja un Chromium de ~115 MB y necesita el dist ya armado.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
