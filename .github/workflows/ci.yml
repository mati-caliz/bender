name: CI

# Sin disparador por push: cada commit a main gastaba minutos de Actions.
# La verificación se corre local en el VPS antes de pushear.
on:
  workflow_dispatch:
  pull_request:

# Un push encima de otro cancela la corrida vieja: solo importa el ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 porque el script `clean` usa `fs` como global de `node -e`, que no esta
      # garantizado en versiones anteriores.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm test

      # El build es parte del check: la extension tiene que poder empaquetarse.
      - run: pnpm run build

  # Aparte del job rapido: baja un Chromium de ~115 MB y necesita el dist ya armado.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
