# Politica de privacidad de Bender, colgada de matiascaliz.com.ar.
#
# La URL publica queda:  https://matiascaliz.com.ar/bender/privacidad
#
# CASO A — el dominio ya lo sirve nginx en este mismo VPS (lo normal):
#   pegar el bloque `location` de abajo dentro del server { } que ya atiende
#   matiascaliz.com.ar en el puerto 443. No hace falta certificado nuevo: el que
#   ya tiene el dominio cubre esta ruta.
#
# CASO B — el dominio esta alojado en otro lado:
#   usar el server { } completo del final, apuntando un subdominio
#   (bender.matiascaliz.com.ar) por DNS a la IP del VPS, y emitir el certificado
#   con `certbot --nginx -d bender.matiascaliz.com.ar`.

# ─────────────────────────────────────────────────────────────────────
# CASO A: pegar esto dentro del server block existente del dominio
# ─────────────────────────────────────────────────────────────────────

location = /bender/privacidad {
    alias /var/www/bender/privacy.html;
    default_type text/html;

    # Documento publico y estatico, pero con cache corta: si hay que corregir la
    # politica, tiene que verse el mismo dia.
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Por si alguien recorta la URL a mano.
location = /bender {
    return 302 /bender/privacidad;
}

